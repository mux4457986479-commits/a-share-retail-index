name: Update retail sentiment data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-retail.yml']
  schedule:
    - cron: '*/30 1-7 * * 1-5'
    - cron: '15 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: retail-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate publication rules
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Collect anonymous public snapshot
        run: python scripts/update.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: Update retail snapshot
          file_pattern: data.json
